<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <header>     
        <h1>Student Registration Form</h1>
        <p>Fill in the form below to register for your course.</p>
    </header>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information</legend>
                <div >
                    <label for="fullname">Full Name*</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                    <label for="email">Email*</label>
                    <input type="text" id="email" name="email" placeholder="Enter your email" required>
                    <label for="number">Phone Number*</label>
                    <input type="number" id="number" name="number" placeholder="example@gmail.com" required>
                    <label for="dob">Date of birth</label>
                    <input type="date" id="dob" name="dob" required>
                    <label for="gender">Gender</label>
                    <input type="radio" id="male" name="gender">
                    <label for="male">male</label>
                    <input type="radio" id="female" name="gender">
                    <label for="female">female</label>
                    <label for="address">Address</label>
                    <textarea name="address" id="address" rows="3" placeholder="Enter your Full Address"></textarea>
                </div>
            </fieldset>
            <fieldset>
                <legend>Educational Information</legend>
                <div>
                    <label for="qualification">Previous qualification*</label>
                    <select name="qualification" id="qualification" required>
                        <option value="">-- Select qualification</option>
                        <option value="10th">10th Standard</option>
                        <option value="12th">12th Standard</option>
                        <option value="diploma">Diploma</option>
                        <option value="Degree">Degree</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="course">Choose Your Course</label>
                    <input type="text" id="course" name="course" placeholder="Select or Type a course" required>
                    <datalist id="courses">
                        <option value="Computer Science"></option>
                        <option value="Data Science"></option>
                        <option value="Web Development"></option>
                        <option value="Artificial Intelligence"></option>
                        <option value="cybersecurity"></option>
                    </datalist>
                </div>
                <div>
                    <label for="startdate">Prefered Joining Date</label>
                    <input type="date" id="startdate" name="startdate" >
                </div>
                <div>
                    <label for="document">Upload Previous Certficate</label>
                    <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png" >
                    <small>Accepted formats: PDF,JPG AND PNG.</small>
                </div>
                <div>
                    <legend>Additional Information</legend>
                    <div>
                        <label for="about">Why you want to join?</label>
                        <textarea name="about" id="about" rows="4" placeholder="Tell us about your Interests"></textarea>
                    </div>
                    <div>
                        <label>Interests</label>
                        <div>
                            <label><input type="checkbox" name="Interests" value="Coding">Coding</label>
                            <label><input type="checkbox" name="Interests" value="Sports">Sports</label>
                            <label><input type="checkbox" name="Interests" value="Design">Design</label>
                            <label><input type="checkbox" name="term" value="accepted" required>I Agree to the terms and conditions.*
                            </label>
                        </div>
                    </div>
                </div>
            </fieldset>
            <div>
                <button type="submit">Register Now</button>
                <button type="reset">Clear Form</button>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Student Registration Portal.All rights reserved</p>
    </footer>
</body>
</html>
